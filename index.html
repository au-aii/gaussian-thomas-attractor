<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gaussian-thomas-attractor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app,
      #fallback {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #fallback {
        display: grid;
        place-items: center;
      }
      #fallback[hidden] {
        display: none;
      }
      #fallback img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #status {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        margin: 0;
        color: #bfc8d8;
        font: 13px/1.5 system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="fallback">
      <img src="/attractor-fallback.jpg" alt="Thomas attractor still image" />
      <p id="status" role="status">アニメーションを準備しています…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
